apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-api-config
  namespace: aiplayground
data:
  BERGET_API_BASE_URL: https://api.berget.ai/v2dev 
  RAG_COURSE_ID: skogskurs
  RAG_SLIDES_DIR: /app/output/slides
  RAG_EMBEDDING_MODEL: intfloat/multilingual-e5-large-instruct
  RAG_EXPECTED_EMBEDDING_DIMENSIONS: "1024"
  RAG_CHAT_MODEL: openai/gpt-oss-120b
  RAG_MIN_SIMILARITY: "0.7"
  RAG_LIMIT: "5"
  ENV: "local2"
  QUEUE_MCP_NAME: mcp_messages
  QUEUE_MCP_HOST: mcp-rabbitmq.aiplayground.svc.cluster.local
