apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - secret.yaml
  - rabitmq.yaml
images:
  - name: europe-north1-docker.pkg.dev/myforesttracker/myforesttracker/rag-api
    newName: rag-api
    newTag: local2
patches:
  - path: configmap.yaml
    target:
      kind: ConfigMap
      name: rag-api-config
  - path: deployment-patch.yml
    target:
      kind: Deployment
      name: rag-api    
