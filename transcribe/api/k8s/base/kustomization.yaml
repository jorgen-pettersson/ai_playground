apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aiplayground
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - apigateway.yaml
  - route.yaml
labels:
  - pairs:
      app.kubernetes.io/name: rag-api
      app.kubernetes.io/part-of: aiplayground
    includeSelectors: true
